# Secret for API keys.
# DO NOT commit real values — fill these in manually or via CI/CD.
#
# To create from the command line instead:
#   kubectl create secret generic cf-analyzer-secrets \
#     --namespace cf-analyzer \
#     --from-literal=GEMINI_API_KEY=<your-key>
#
# Values below must be base64-encoded: echo -n "value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: cf-analyzer-secrets
  namespace: cf-analyzer
type: Opaque
data:
  GEMINI_API_KEY: ""   # replace with: echo -n "your-key" | base64
