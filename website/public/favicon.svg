<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Drawn to fill the frame: at 16px in a tab, the mark needs to occupy
       nearly the whole canvas or it reads as a coloured smudge. -->
  <defs>
    <linearGradient id="b" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E9BFF"/>
      <stop offset="55%" stop-color="#3B5BFF"/>
      <stop offset="100%" stop-color="#7A3BFF"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="#0B0D12"/>
  <!-- brackets -->
  <path d="M17 15 L6 32 L17 49" stroke="#FFFFFF" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M47 15 L58 32 L47 49" stroke="#FFFFFF" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- bars -->
  <rect x="21"   y="38" width="7.5" height="13" rx="2.4" fill="url(#b)"/>
  <rect x="30.8" y="30" width="7.5" height="21" rx="2.4" fill="url(#b)"/>
  <rect x="40.6" y="22" width="7.5" height="29" rx="2.4" fill="url(#b)"/>
  <!-- trend line -->
  <path d="M22 33 L34.5 25 L45 15" stroke="url(#b)" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="34.5" cy="25" r="3.6" fill="#3B5BFF"/>
  <circle cx="45" cy="15" r="4.2" fill="#7A3BFF"/>
</svg>
