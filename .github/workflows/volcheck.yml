name: Volume check
on: { workflow_dispatch: {} }
jobs:
  vol:
    runs-on: ubuntu-latest
    steps:
      - name: Report volume capacity as Postgres sees it
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          set +e
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1
          echo "=== database size vs volume ==="
          psql "$DATABASE_URL" -tAc "SELECT 'db_size: '||pg_size_pretty(pg_database_size(current_database()));"
          # pg_ls_dir/temp usage needs superuser; settings are readable.
          psql "$DATABASE_URL" -tAc "SELECT 'data_directory: '||setting FROM pg_settings WHERE name='data_directory';"
          psql "$DATABASE_URL" -tAc "SELECT 'temp_file_limit: '||setting FROM pg_settings WHERE name='temp_file_limit';"
          exit 0
