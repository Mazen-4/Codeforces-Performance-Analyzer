name: Redeploy check
on: { workflow_dispatch: {} }
jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          echo "token length: ${#RAILWAY_TOKEN}"
          RESP=$(curl -sS -X POST \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { serviceInstanceRedeploy(serviceId: \\\"$RAILWAY_SERVICE_ID\\\", environmentId: \\\"$RAILWAY_ENVIRONMENT_ID\\\") }\"}" \
            https://backboard.railway.com/graphql/v2)
          echo "$RESP"
          case "$RESP" in
            *'"errors"'*) echo "FAILED: Railway rejected the call"; exit 1 ;;
          esac
          echo "SUCCESS: redeploy triggered"
