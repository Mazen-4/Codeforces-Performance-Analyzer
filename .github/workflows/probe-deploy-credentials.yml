name: Probe deploy credentials

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test database connectivity properly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          # GitHub runs steps with `bash -e`; without this the function's
          # first failing psql aborts the whole step before printing anything.
          set +e
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1

          probe_url() {
            local label="$1" url="$2"
            if [ -z "$url" ]; then echo "$label: secret not set"; return; fi
            # No pipe here: piping to head discards psql's exit status, which
            # is what made the previous probe report a DNS failure as success.
            local out rc
            out=$(timeout 20 psql "$url" -tAc "select current_database()||' @ '||version()" 2>&1)
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "$label: CONNECTED -> ${out:0:70}"
            else
              echo "$label: FAILED (exit $rc) -> ${out:0:160}"
            fi
          }

          probe_url "DATABASE_URL (private)" "$DATABASE_URL"
          probe_url "DATABASE_PUBLIC_URL"    "$DATABASE_PUBLIC_URL"
          exit 0
