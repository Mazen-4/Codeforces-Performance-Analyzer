name: Probe deploy credentials

# Temporary: proves the Postgres load + verify chain works from CI without
# paying the ~1h crawl. Delete once the weekly run is confirmed green.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Fetch latest released dataset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch_latest_release.sh

      - name: Load into Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL || secrets.DATABASE_URL }}
          # Railway's default Postgres volume is 5 GB. Staging-and-swap needs
          # ~2x the table size while both copies exist, which overruns it for
          # a 14M-row table. Load in place instead.
          LOW_DISK: "1"
        run: DATA_DIR=${{ github.workspace }} python scripts/db/load.py

      - name: Verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL || secrets.DATABASE_URL }}
        run: DATA_DIR=${{ github.workspace }} python scripts/db/verify.py

      - name: Trigger Railway redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          RESP=$(curl -sS -X POST \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { serviceInstanceRedeploy(serviceId: \\\"$RAILWAY_SERVICE_ID\\\", environmentId: \\\"$RAILWAY_ENVIRONMENT_ID\\\") }\"}" \
            https://backboard.railway.com/graphql/v2)
          echo "$RESP"
          case "$RESP" in
            *'"errors"'*) echo "ERROR: Railway API returned errors"; exit 1 ;;
          esac
          echo "Redeploy triggered."
