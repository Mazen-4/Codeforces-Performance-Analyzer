name: Probe deploy credentials

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check which secrets are visible
        env:
          DEPLOY_HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -u
          p() { if [ -n "${2:-}" ]; then echo "  $1: SET (${#2} chars)"; else echo "  $1: missing"; fi; }
          echo "Secrets visible to this workflow:"
          p RAILWAY_DEPLOY_HOOK "$DEPLOY_HOOK"
          p RAILWAY_TOKEN "$RAILWAY_TOKEN"
          p RAILWAY_SERVICE_ID "$RAILWAY_SERVICE_ID"
          p RAILWAY_ENVIRONMENT_ID "$RAILWAY_ENVIRONMENT_ID"
          p DATABASE_URL "$DATABASE_URL"
          echo ""
          case "$DATABASE_URL" in
            *railway.internal*) echo "  DATABASE_URL host: PRIVATE (.railway.internal)" ;;
            *proxy.rlwy.net*)   echo "  DATABASE_URL host: PUBLIC proxy" ;;
            *) echo "  DATABASE_URL host: unrecognized shape" ;;
          esac

      - name: Can GitHub Actions reach the database?
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1
          echo "Attempting connection (15s timeout) …"
          if timeout 15 psql "$DATABASE_URL" -c "select version();" 2>&1 | head -3; then
            echo "RESULT: reachable"
          else
            echo "RESULT: NOT reachable from GitHub Actions"
            echo "If the URL is .railway.internal, that is expected — private"
            echo "networking only resolves inside Railway, not from CI."
          fi

      - name: Does the Railway token authenticate?
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          [ -z "$RAILWAY_TOKEN" ] && { echo "no token; skipping"; exit 0; }
          RESP=$(curl -sS -X POST \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"query { me { email } }"}' \
            https://backboard.railway.com/graphql/v2)
          case "$RESP" in
            *'"errors"'*) echo "Token rejected on me{} (may be a project token — that is fine)";;
            *) echo "Token authenticates.";;
          esac
          echo "Raw (redacted): $(echo "$RESP" | sed -E 's/[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+/<email>/g' | head -c 300)"
