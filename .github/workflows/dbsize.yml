name: DB size check
on: { workflow_dispatch: {} }
jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect database size
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          set +e
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1
          echo "=== database size ==="
          psql "$DATABASE_URL" -c "SELECT pg_size_pretty(pg_database_size(current_database())) AS db_size;"
          echo "=== per-table ==="
          psql "$DATABASE_URL" -c "SELECT relname, pg_size_pretty(pg_total_relation_size(c.oid)) AS total FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='r' ORDER BY pg_total_relation_size(c.oid) DESC;"
          echo "=== leftover tables ==="
          psql "$DATABASE_URL" -c "SELECT tablename FROM pg_tables WHERE schemaname='public';"
          exit 0
