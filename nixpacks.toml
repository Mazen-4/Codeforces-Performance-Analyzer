[phases.setup]
# nodejs_22, not _20: vite 7 requires node ^20.19.0 || >=22.12.0, and nixpacks'
# nodejs_20 resolves to v20.18.0 — just below the cutoff (EBADENGINE at build).
nixPkgs = ["python311", "python311Packages.pip", "nodejs_22", "nodePackages.npm"]

[phases.install]
cmds = ["bash scripts/setup_render.sh"]

[start]
# Fetch the latest release models fresh on every deploy, then start the server.
# (The install phase is cached, so it can't be relied on to pull new models.)
cmd = "bash scripts/start.sh"

[variables]
NIXPACKS_NODE_VERSION = "22"
